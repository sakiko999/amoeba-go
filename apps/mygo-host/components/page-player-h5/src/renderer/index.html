<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- 共享层：react/@demo/ui 解析到 vendor://（pack 时插件在 CSP meta 之后注入 import map）。
         媒体相关的放行项：
           - media-src blob: → MSE（hls.js/dash.js/flv.js）的 SourceBuffer
           - connect-src blob: → dash.js 经 fetch 拉 blob MPD；https/http 供 flv.js 直连 CDN
           - worker-src blob: → hls.js 的转封装 worker -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' vendor:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https: http:; connect-src 'self' blob: https: http: ws: wss:; worker-src 'self' blob:"
    />
    <title>H5 播放器</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
