<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <!-- 'self' 给打包后的 tailwind css；'unsafe-inline' 给 React 的 style 属性；ws: 供 dev HMR。导航拦截在主进程 -->
    <title>Tabs Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- electron-vite：dev 直接转换 ./renderer.tsx，build 打包产物并重写引用 -->
    <script type="module" src="./renderer.tsx"></script>
  </body>
</html>
