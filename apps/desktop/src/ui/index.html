<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <!-- 'self' 给打包后的 tailwind css；'unsafe-inline' 给 React 的 style 属性；ws: 供 dev HMR。导航拦截在主进程 -->
    <title>Tabs Demo</title>
    <style>
      /* dev 首屏骨架：tailwind 与 React 尚未加载时先给反馈；React 挂载会替换 #root 内容。
         背景透明，透出窗口底色（tab 条色），亮暗主题都协调 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #8a8a8a;
        font:
          13px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
      }
      #boot .ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgb(128 128 128 / 30%);
        border-top-color: #8a8a8a;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring"></div>
      <div>正在启动…</div>
    </div>
    <div id="root"></div>
    <!-- electron-vite：dev 直接转换 ./renderer.tsx，build 打包产物并重写引用 -->
    <script type="module" src="./renderer.tsx"></script>
  </body>
</html>
