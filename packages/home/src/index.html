<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #111113;
        --border: #26262b;
        --text: #f4f4f5;
        --muted: #9ca3af;
        --accent: #7dcfff;
        --accent-soft: rgba(125, 207, 255, 0.14);
        --ok: #9ece6a;
        --danger: #f7768e;
        --chip: #1f1f24;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #1f6feb;
        --accent-soft: rgba(31, 111, 235, 0.1);
        --ok: #3f8f2f;
        --danger: #cf222e;
        --chip: #f4f4f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .app {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 24px 40px;
      }
      header.top {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .summary {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
      }
      .refresh {
        margin-left: auto;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 14px;
        cursor: pointer;
      }
      .refresh:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .issues {
        margin: 0 0 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .issue {
        color: var(--danger);
        font-size: 12px;
      }
      .section-title {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
      }
      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 12px;
        margin-bottom: 26px;
      }
      .nav-card {
        font: inherit;
        text-align: left;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--muted);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.15s, transform 0.1s;
      }
      .nav-card:hover {
        border-color: var(--accent);
      }
      .nav-card:active {
        transform: translateY(1px);
      }
      .nav-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .nav-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .nav-title {
        font-weight: 600;
        font-size: 14px;
      }
      .nav-id {
        color: var(--muted);
        font-size: 11px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .nav-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--muted);
      }
      .badge.state-error {
        color: var(--danger);
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .kv {
        margin: 0;
      }
      .kv-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .kv-row:last-child {
        border-bottom: none;
      }
      .kv-row dt {
        color: var(--muted);
      }
      .kv-row dd {
        margin: 0;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--accent-soft);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stat strong {
        font-size: 20px;
        font-weight: 600;
        color: var(--accent);
      }
      .stat span {
        color: var(--muted);
        font-size: 12px;
      }
      .hint-line {
        color: var(--muted);
        font-size: 12px;
        margin: 12px 0 0;
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>首页</h1>
        <div class="summary" id="summary"></div>
        <button class="refresh" id="refresh" type="button">刷新</button>
      </header>
      <div class="issues" id="issues" hidden></div>
      <main>
        <section>
          <h2 class="section-title">子页面</h2>
          <div class="nav-grid" id="nav"></div>
        </section>
        <div class="info-grid">
          <section class="panel">
            <h2 class="section-title">系统环境</h2>
            <dl class="kv" id="env"></dl>
          </section>
          <section class="panel">
            <h2 class="section-title">组件概览</h2>
            <div class="stats" id="stats"></div>
            <p class="hint-line">组件状态与依赖关系详见「组件依赖」页面。</p>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
