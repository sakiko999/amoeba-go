<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组件依赖</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #111113;
        --border: #26262b;
        --text: #f4f4f5;
        --muted: #9ca3af;
        --accent: #7aa2f7;
        --accent-soft: rgba(122, 162, 247, 0.16);
        --ok: #9ece6a;
        --warn: #e0af68;
        --danger: #f7768e;
        --chip: #1f1f24;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #3b6fd4;
        --accent-soft: rgba(59, 111, 212, 0.12);
        --ok: #3f8f2f;
        --warn: #9a6700;
        --danger: #cf222e;
        --chip: #f4f4f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .app {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 24px 40px;
      }
      header.top {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .summary {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
      }
      .refresh {
        margin-left: auto;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 14px;
        cursor: pointer;
      }
      .refresh:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .issues {
        margin: 12px 0 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .issue {
        color: var(--danger);
        font-size: 12px;
      }
      .issue.warn {
        color: var(--warn);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 10px 0 14px;
      }
      .graph-wrap {
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .graph {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 56px;
        min-height: 120px;
        padding: 6px 4px 18px;
      }
      .layer {
        min-width: 230px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .layer-title {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 2px;
        font-weight: 600;
      }
      .layer-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .node {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--muted);
        border-radius: 10px;
        padding: 10px 12px;
        transition:
          opacity 0.15s,
          border-color 0.15s;
      }
      .node[data-state="active"] {
        border-left-color: var(--ok);
      }
      .node[data-state="error"] {
        border-left-color: var(--danger);
      }
      .node[data-missing="true"] {
        box-shadow: inset 0 0 0 1px var(--danger);
      }
      .node.dim {
        opacity: 0.25;
      }
      .node-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .node-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .node-name {
        font-weight: 600;
      }
      .node-id {
        color: var(--muted);
        font-size: 11px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .node-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--muted);
      }
      .badge.state-active {
        color: var(--ok);
      }
      .badge.state-error {
        color: var(--danger);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .chip {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid transparent;
      }
      .chip.ghost {
        background: var(--chip);
        color: var(--muted);
      }
      .chip.missing {
        background: transparent;
        border-color: var(--danger);
        color: var(--danger);
      }
      .chip[title] {
        cursor: help;
      }
      .edges {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .edge {
        stroke: var(--accent);
        stroke-width: 1.4;
        fill: none;
        opacity: 0.5;
        color: var(--accent);
      }
      .edges marker path {
        fill: var(--accent);
      }
      .edge.dim {
        opacity: 0.08;
      }
      .table-section {
        margin-top: 28px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      td code {
        font-size: 11px;
        color: var(--muted);
      }
      .cell-name {
        display: flex;
        flex-direction: column;
      }
      td .chips {
        margin-top: 0;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>组件依赖</h1>
        <div class="summary" id="summary"></div>
        <button class="refresh" id="refresh" type="button">刷新</button>
      </header>
      <div class="issues" id="issues" hidden></div>
      <p class="hint">
        箭头 = 服务依赖（提供方 →
        消费方），边上标注服务名；无依赖的组件排在最左列。 依赖来自各组件的
        component.json（provides / inject）。
      </p>
      <div class="graph-wrap">
        <div class="graph" id="graph"></div>
      </div>
      <section class="table-section">
        <h2 class="layer-title">组件清单</h2>
        <table>
          <thead>
            <tr>
              <th>组件</th>
              <th>版本</th>
              <th>类型</th>
              <th>来源</th>
              <th>状态</th>
              <th>提供</th>
              <th>依赖</th>
            </tr>
          </thead>
          <tbody id="components-body"></tbody>
        </table>
      </section>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
